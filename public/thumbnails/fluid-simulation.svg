<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="fl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020d23"/>
      <stop offset="100%" stop-color="#010509"/>
    </linearGradient>
    <radialGradient id="fl-blob-a" cx="30%" cy="62%" r="40%">
      <stop offset="0%" stop-color="#145285" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#145285" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fl-blob-b" cx="75%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#0d2e5c" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#0d2e5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fl-blob-c" cx="52%" cy="25%" r="36%">
      <stop offset="0%" stop-color="#05142e" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#05142e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fl-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e6ea6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e6ea6" stop-opacity="0"/>
    </radialGradient>
    <filter id="fl-blur-sm">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="fl-blur-lg">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#fl-bg)"/>

  <!-- Ambient glow -->
  <rect width="400" height="240" fill="url(#fl-glow)"/>

  <!-- Fluid blobs (large, soft) -->
  <ellipse cx="118" cy="148" rx="110" ry="72" fill="url(#fl-blob-a)"/>
  <ellipse cx="298" cy="106" rx="118" ry="66" fill="url(#fl-blob-b)"/>
  <ellipse cx="206" cy="58"  rx="130" ry="54" fill="url(#fl-blob-c)"/>

  <!-- Flow lines — large gentle curves -->
  <path d="M -10 190 C 60 155, 130 205, 200 168 C 270 131, 330 175, 420 148"
        stroke="#2a7ab8" stroke-width="1.8" fill="none" opacity="0.55" filter="url(#fl-blur-sm)"/>
  <path d="M -10 162 C 70 130, 150 178, 220 142 C 290 106, 360 150, 420 122"
        stroke="#3d8fca" stroke-width="1.4" fill="none" opacity="0.45"/>
  <path d="M -10 135 C 80 108, 160 152, 230 118 C 300 84,  370 124, 420 98"
        stroke="#4aa2cc" stroke-width="1.2" fill="none" opacity="0.38"/>
  <path d="M -10 108 C 85 85,  165 125, 240 96  C 315 67,  380 100, 420 78"
        stroke="#2a7ab8" stroke-width="1.0" fill="none" opacity="0.30"/>
  <path d="M -10 78  C 90 60,  170 94,  250 70  C 330 46,  390 74,  420 56"
        stroke="#3d8fca" stroke-width="0.8" fill="none" opacity="0.22"/>

  <!-- Secondary cross-flow -->
  <path d="M 0 220 C 100 180, 200 200, 300 160 C 360 140, 400 160, 420 150"
        stroke="#1a5a8a" stroke-width="1.6" fill="none" opacity="0.40" filter="url(#fl-blur-sm)"/>
  <path d="M 0 50  C 80 70,  180 40,  280 65  C 340 80,  390 60,  420 70"
        stroke="#1a5a8a" stroke-width="1.2" fill="none" opacity="0.28"/>

  <!-- Highlight rim on blobs (unblurred) -->
  <path d="M 20 130 C 80 100, 160 145, 220 115 C 260 95, 280 110, 300 105"
        stroke="#5bb8d8" stroke-width="0.8" fill="none" opacity="0.30"/>
  <path d="M 150 170 C 200 155, 260 175, 330 155"
        stroke="#5bb8d8" stroke-width="0.7" fill="none" opacity="0.25"/>

  <!-- Soft large glow spots (suggest density) -->
  <circle cx="118" cy="148" r="55" fill="#1a5a8a" opacity="0.12" filter="url(#fl-blur-lg)"/>
  <circle cx="298" cy="106" r="60" fill="#0d3060" opacity="0.14" filter="url(#fl-blur-lg)"/>
</svg>
