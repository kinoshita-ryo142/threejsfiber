<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="tm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="tm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="tm-clip">
      <rect width="400" height="240"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#tm-bg)"/>

  <g clip-path="url(#tm-clip)">
    <!-- Band 1: Navy, rotated -35deg, offset upper -->
    <g transform="translate(200,80) rotate(-35)" filter="url(#tm-shadow)">
      <rect x="-520" y="-22" width="1040" height="44" fill="#16213e"/>
      <text y="0" dominant-baseline="middle" text-anchor="start" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="2" x="-510">CREATIVE • DESIGN • INNOVATION • TECHNOLOGY • FUTURE • WEB • CREATIVE • DESIGN • INNOVATION •</text>
    </g>

    <!-- Band 2: White, horizontal, center -->
    <g transform="translate(200,128) rotate(0)" filter="url(#tm-shadow)">
      <rect x="-520" y="-22" width="1040" height="44" fill="#f0f0f0"/>
      <text y="0" dominant-baseline="middle" text-anchor="start" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="16" fill="#111111" letter-spacing="2" x="-510">MOTION • GRAPHICS • VISUAL • ART • DIGITAL • INTERACTIVE • MOTION • GRAPHICS • VISUAL •</text>
    </g>

    <!-- Band 3: Red, rotated +35deg, offset lower -->
    <g transform="translate(200,178) rotate(35)" filter="url(#tm-shadow)">
      <rect x="-520" y="-22" width="1040" height="44" fill="#e63946"/>
      <text y="0" dominant-baseline="middle" text-anchor="start" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="2" x="-510">CODE • EXPERIENCE • ANIMATE • CREATE • EXPLORE • BUILD • CODE • EXPERIENCE • ANIMATE •</text>
    </g>
  </g>
</svg>
