<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg-cs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="100%" stop-color="#071525"/>
    </linearGradient>
    <linearGradient id="s-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bde0ff" stop-opacity="0.7"/>
      <stop offset="48%"  stop-color="#f0f8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bde0ff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg-cs)"/>

  <!-- Ambient center glow -->
  <ellipse cx="200" cy="120" rx="130" ry="100" fill="url(#center-glow)"/>

  <!-- S-shape glass ribbon (slightly tilted for 3D rotating impression) -->
  <g transform="rotate(-8, 200, 120)">

    <!-- Depth halo (blurred) -->
    <path d="M 200,52 C 286,52 286,118 200,118 C 114,118 114,186 200,186"
          stroke="#1e4a70" stroke-width="46" fill="none" stroke-linecap="round"
          filter="url(#soft-blur)" opacity="0.55"/>

    <!-- Glass backing (dark core) -->
    <path d="M 200,52 C 286,52 286,118 200,118 C 114,118 114,186 200,186"
          stroke="#081828" stroke-width="34" fill="none" stroke-linecap="round"/>

    <!-- Glass body: outer soft blue -->
    <path d="M 200,52 C 286,52 286,118 200,118 C 114,118 114,186 200,186"
          stroke="#8cc8f0" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.38"/>

    <!-- Glass body: inner bright layer (transmission) -->
    <path d="M 200,52 C 286,52 286,118 200,118 C 114,118 114,186 200,186"
          stroke="#d6efff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.28"/>

    <!-- Specular edge highlight (top surface) -->
    <path d="M 200,52 C 286,52 286,118 200,118 C 114,118 114,186 200,186"
          stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.65"/>

    <!-- Shadow edge (side in shadow) -->
    <path d="M 200,52 C 286,52 286,118 200,118 C 114,118 114,186 200,186"
          stroke="#4a88b0" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.45"
          transform="translate(17, 2)"/>

  </g>

  <!-- Rotation guide ellipse (equatorial ring) -->
  <ellipse cx="200" cy="120" rx="88" ry="15"
           fill="none" stroke="#4a9eca" stroke-width="1"
           stroke-dasharray="6,4" opacity="0.35"/>

  <!-- Rotation arrow -->
  <path d="M 281 110 A 88 15 0 0 1 252 134"
        stroke="#7ec8e3" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="282,104 276,114 286,112" fill="#7ec8e3" opacity="0.5"/>

  <!-- Specular glints (refraction points) -->
  <circle cx="243" cy="67"  r="4"   fill="#ffffff" opacity="0.55"/>
  <circle cx="158" cy="173" r="3"   fill="#ffffff" opacity="0.40"/>
  <circle cx="251" cy="61"  r="1.8" fill="#ffffff" opacity="0.80"/>
  <circle cx="150" cy="179" r="1.4" fill="#ffffff" opacity="0.55"/>

  <!-- Light refraction streak -->
  <line x1="228" y1="58" x2="215" y2="82"
        stroke="#ffffff" stroke-width="1" opacity="0.22"/>
</svg>
